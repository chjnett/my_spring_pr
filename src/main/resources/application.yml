spring:
  application:
    name: secureflow

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/secureflow
    username: ${DB_USERNAME:secureflow}
    password: ${DB_PASSWORD:devpassword}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

secureflow:
  audit:
    integrity:
      key-id: ${AUDIT_HMAC_KEY_ID:local-v1}
      secret: ${AUDIT_HMAC_SECRET}
  bootstrap-admin:
    name: ${SECUREFLOW_BOOTSTRAP_ADMIN_NAME:SecureFlow Admin}
    email: ${SECUREFLOW_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${SECUREFLOW_BOOTSTRAP_ADMIN_PASSWORD:}
  outbox:
    publisher:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:false}
      fixed-delay: ${OUTBOX_PUBLISHER_FIXED_DELAY:1000}
