spring:
  application:
    name: secureflow

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/secureflow
    username: ${DB_USERNAME:secureflow}
    password: ${DB_PASSWORD:devpassword}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"

secureflow:
  audit:
    integrity:
      key-id: ${AUDIT_HMAC_KEY_ID:local-v1}
      secret: ${AUDIT_HMAC_SECRET}
  security-events:
    ingest:
      enabled: ${SECURITY_EVENT_INGEST_ENABLED:false}
      source-id: ${SECURITY_EVENT_INGEST_SOURCE_ID:local-service}
      api-key: ${SECURITY_EVENT_INGEST_API_KEY:}
      max-batch-size: ${SECURITY_EVENT_INGEST_MAX_BATCH_SIZE:500}
  bootstrap-admin:
    name: ${SECUREFLOW_BOOTSTRAP_ADMIN_NAME:SecureFlow Admin}
    email: ${SECUREFLOW_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${SECUREFLOW_BOOTSTRAP_ADMIN_PASSWORD:}
  outbox:
    publisher:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:false}
      fixed-delay: ${OUTBOX_PUBLISHER_FIXED_DELAY:1000}
      batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:100}
      max-attempts: ${OUTBOX_PUBLISHER_MAX_ATTEMPTS:5}
      base-backoff: ${OUTBOX_PUBLISHER_BASE_BACKOFF:1s}
      max-backoff: ${OUTBOX_PUBLISHER_MAX_BACKOFF:5m}
