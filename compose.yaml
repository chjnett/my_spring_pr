services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: secureflow
      POSTGRES_USER: secureflow
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5433:5432"
    volumes:
      - secureflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureflow -d secureflow"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  secureflow-postgres:
