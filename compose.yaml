services:
  secureflow:
    build:
      context: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: secureflow_app
      DB_PASSWORD: ${DB_PASSWORD:-devpassword}
      DB_MIGRATOR_USERNAME: secureflow_migrator
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:-dev-migrator-password}
      AUDIT_HMAC_KEY_ID: ${AUDIT_HMAC_KEY_ID:-local-v1}
      AUDIT_HMAC_SECRET: ${AUDIT_HMAC_SECRET:?AUDIT_HMAC_SECRET must be set}
      SECUREFLOW_BOOTSTRAP_ADMIN_EMAIL: ${SECUREFLOW_BOOTSTRAP_ADMIN_EMAIL:?SECUREFLOW_BOOTSTRAP_ADMIN_EMAIL must be set}
      SECUREFLOW_BOOTSTRAP_ADMIN_PASSWORD: ${SECUREFLOW_BOOTSTRAP_ADMIN_PASSWORD:?SECUREFLOW_BOOTSTRAP_ADMIN_PASSWORD must be set}
      OUTBOX_PUBLISHER_ENABLED: ${OUTBOX_PUBLISHER_ENABLED:-true}
      SECURITY_EVENT_INGEST_ENABLED: ${SECURITY_EVENT_INGEST_ENABLED:-true}
      SECURITY_EVENT_INGEST_SOURCE_ID: ${SECURITY_EVENT_INGEST_SOURCE_ID:-local-service}
      SECURITY_EVENT_INGEST_API_KEY: ${SECURITY_EVENT_INGEST_API_KEY:?SECURITY_EVENT_INGEST_API_KEY must be set}
      DETECTION_ENABLED: ${DETECTION_ENABLED:-true}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: secureflow
      POSTGRES_USER: secureflow_migrator
      POSTGRES_PASSWORD: ${DB_MIGRATOR_PASSWORD:-dev-migrator-password}
      POSTGRES_APP_PASSWORD: ${DB_PASSWORD:-devpassword}
    ports:
      - "5433:5432"
    volumes:
      - secureflow-postgres:/var/lib/postgresql/data
      - ./ops/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureflow_migrator -d secureflow"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      secureflow:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.1
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: secureflow
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  secureflow-postgres:
  prometheus-data:
  grafana-data:
